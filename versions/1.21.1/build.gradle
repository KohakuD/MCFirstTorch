plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

evaluationDependsOn(':core')
group = rootProject.mod_group_id
version = rootProject.mod_version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    mods {
        firsttorch {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
    unitTest {
        enable()
        testedMod = mods.firsttorch
    }
}

dependencies {
    implementation project(':core').sourceSets.main.output
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Copy only explicitly reviewed compatible sources; generated files never enter Git.
var syncSharedRuntimeSources = tasks.register('syncSharedRuntimeSources', Sync) {
    from('../../src/main/java') {
        include 'ch/minenox/firsttorch/guide/server/RewardJournal.java'
        include 'ch/minenox/firsttorch/guide/server/AdvancementObservation.java'
        include 'ch/minenox/firsttorch/guide/server/BulkRewardClaims.java'
        include 'ch/minenox/firsttorch/guide/server/InventoryCounts.java'
        include 'ch/minenox/firsttorch/guide/server/ServerGuideRepository.java'
        include 'ch/minenox/firsttorch/guide/server/ProgressObservation.java'
        include 'ch/minenox/firsttorch/guide/server/ServerWelcomeService.java'
    }
    into layout.buildDirectory.dir('generated/sources/sharedRuntime')
}
sourceSets.main.java.srcDir syncSharedRuntimeSources

// The same regressions exercise both Minecraft targets, without duplicating maintained tests.
var syncSharedTestSources = tasks.register('syncSharedTestSources', Sync) {
    from('../../src/test/java') {
        include 'ch/minenox/firsttorch/network/*Test.java'
        include '**/WorldProgressDataTest.java', '**/WorldWelcomeDataTest.java'
        include '**/RewardJournalTest.java', '**/BulkRewardClaimsTest.java'
        include '**/ProgressObservationTest.java', '**/InventoryTagObservationTest.java'
        include '**/AdvancementObservationTest.java', '**/ServerWelcomeServiceTest.java'
    }
    into layout.buildDirectory.dir('generated/sources/sharedTests')
}
sourceSets.test.java.srcDir syncSharedTestSources

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('check').configure { dependsOn ':core:check' }
// This target is under construction. Do not produce a misleading installable mod.
tasks.named('jar').configure { enabled = false }
