plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

evaluationDependsOn(':core')
group = rootProject.mod_group_id
version = '0.14.0-beta.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            systemProperty 'firsttorch.devWindowLayout', 'left_two_thirds'
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
    mods {
        firsttorch {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
    unitTest {
        enable()
        testedMod = mods.firsttorch
    }
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    implementation project(':core').sourceSets.main.output
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

