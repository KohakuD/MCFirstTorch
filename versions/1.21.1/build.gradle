    from('../../src/test/java') {
        include 'ch/minenox/firsttorch/client/AutomaticQuestCompletionTrackerTest.java'
        include 'ch/minenox/firsttorch/client/ChapterArchiveTest.java'
        include 'ch/minenox/firsttorch/client/ChapterCompletionTrackerTest.java'
        include 'ch/minenox/firsttorch/client/ChapterScrollTest.java'
        include 'ch/minenox/firsttorch/client/ChapterVisibilityTest.java'
        include 'ch/minenox/firsttorch/client/ClientGuideCacheTest.java'
        include 'ch/minenox/firsttorch/client/DevelopmentWindowLayoutTest.java'
        include 'ch/minenox/firsttorch/client/ExperienceRewardSoundTest.java'
        include 'ch/minenox/firsttorch/client/FirstTorchLayoutTest.java'
        include 'ch/minenox/firsttorch/client/FirstTorchViewportTest.java'
        include 'ch/minenox/firsttorch/client/GuideBrowserViewModelTest.java'
        include 'ch/minenox/firsttorch/client/ParallelQuestLayoutTest.java'
        include 'ch/minenox/firsttorch/client/PauseGuideEntryLayoutTest.java'
        include 'ch/minenox/firsttorch/client/QuestLinkNavigationTest.java'
        include 'ch/minenox/firsttorch/client/QuestNarrationStateTest.java'
        include 'ch/minenox/firsttorch/client/QuestRecommendationTest.java'
        include 'ch/minenox/firsttorch/client/TaskGridLayoutTest.java'
        include 'ch/minenox/firsttorch/client/TrophyCollectionLayoutTest.java'
        include 'ch/minenox/firsttorch/client/WelcomePromptStateTest.java'
        include 'ch/minenox/firsttorch/network/*Test.java'
        include '**/WorldProgressDataTest.java', '**/WorldWelcomeDataTest.java'
        include '**/RewardJournalTest.java', '**/BulkRewardClaimsTest.java'
        include '**/ProgressObservationTest.java', '**/InventoryTagObservationTest.java'
        include '**/AdvancementObservationTest.java', '**/ServerWelcomeServiceTest.java'
    }
    into layout.buildDirectory.dir('generated/sources/sharedTests')
}
sourceSets.test.java.srcDir syncSharedTestSources

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'firsttorch.captureSourceDir', rootProject.file('src/main/resources').absolutePath
    def vanillaData = layout.buildDirectory.file('moddev/artifacts/neoforge-21.1.248-client-extra-aka-minecraft-resources.jar')
    inputs.file(vanillaData)
    systemProperty 'firsttorch.vanillaDataJar', vanillaData.get().asFile.absolutePath
}

tasks.named('check').configure { dependsOn ':core:check' }
base { archivesName = "${rootProject.mod_id}-mc1.21.1" }

// Apply target overrides once and retain the owner-approved shared captures.
def captures = ['blaze_spawner.png', 'end_arrival_platform_capture.png',
                    'end_portal_active_capture.png', 'end_portal_room_capture.png',
                    'nether_fortress.png', 'nether_wart_garden.png', 'pumpkin_view_capture.png',
                    'stronghold_iron_door_capture.png', 'village_overview.png',
                    'end_battlefield.png', 'end_city_search.png', 'end_exit_portal.png',
                    'end_gateway_access.png', 'end_island_crossing.png', 'chorus_harvest.png']

def targetResourceDirectory = file('src/main/resources')
var syncTargetResources = tasks.register('syncTargetResources', Sync) {
    from('../../src/main/resources') {
        filesMatching('assets/firsttorch/textures/questpics/**') {
            if (!captures.contains(name)) exclude()
        }
        exclude { details -> new File(targetResourceDirectory, details.relativePath.toString()).isFile() }
    }
    from('src/main/resources')
    into layout.buildDirectory.dir('generated/resources/target')
}
sourceSets.main.resources.setSrcDirs([syncTargetResources])

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [mod_id: rootProject.mod_id, mod_name: rootProject.mod_name,
        mod_license: rootProject.mod_license, mod_version: project.version,
        mod_authors: rootProject.mod_authors, mod_description: rootProject.mod_description]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/resources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from project(':core').sourceSets.main.output
    from(['../../LICENSE', '../../LICENSE-CODE', '../../LICENSE-ASSETS.md', '../../NOTICE.md']) { into 'META-INF' }
}