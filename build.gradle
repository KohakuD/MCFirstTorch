plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'firsttorch.devWindowLayout', 'left_two_thirds'
            systemProperty 'firsttorch.testMode', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'firsttorch.projectDir', projectDir.absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
// Migrated illustrations use runtime item models. Keep historical PNGs out of all packaged resources.
tasks.named('processResources', ProcessResources).configure {
    ['wooden_pickaxe', 'wooden_shovel', 'stone_pickaxe', 'stone_axe', 'iron_pickaxe',
     'iron_sword', 'furnace', 'chest', 'bucket', 'golden_helmet',
     'shield', 'bookshelf_recipe', 'bread', 'shulker_box_recipe', 'brewing_stand_recipe',
     'glass_bottle_recipe', 'enchanting_table_recipe', 'blaze_powder_recipe', 'bone_meal_recipe',
     'ender_eye_recipe', 'flint_and_steel', 'magma_cream_recipe',
     'awkward_potion_brewing', 'strength_potion_brewing', 'fire_resistance_brewing',
     'long_fire_resistance_brewing', 'fence_and_gate', 'map_recipe', 'bow_and_arrows',
     'boat_recipe', 'stone_hoe', 'bed', 'stonecutter', 'lodestone',
     'paper_and_book', 'firework_rocket_recipe', 'armour_recipes', 'charcoal', 'cooking_food'].each { name ->
        exclude "assets/firsttorch/textures/questpics/${name}.png"
    }
}
// All curriculum artwork is owned by the native resources; archives are never build inputs.
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    from('NOTICE.md') { into 'META-INF' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
